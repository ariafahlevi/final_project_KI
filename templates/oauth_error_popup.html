<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Otentikasi Dibatalkan · PhisGuard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #08130e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #0c1c15;
      border: 1px solid #7f1d1d;
      padding: 32px 28px;
      border-radius: 14px;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .dot {
      width: 44px;
      height: 44px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot">&times;</div>
    <h3 style="margin:0 0 8px 0; color:#fca5a5; font-size:16px;">Otentikasi Tidak Selesai</h3>
    <p style="font-size:12.5px; color:#cbd5e1; margin:0 0 16px 0; line-height:1.5;">
      {{ error_message or "Proses persetujuan Google dibatalkan atau ditolak." }}
    </p>
    <button onclick="window.close()" style="background:#334155;color:#f8fafc;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;">Tutup Jendela</button>
  </div>
  <script>
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "GMAIL_AUTH_ERROR", error: "{{ error_message }}" }, "*");
        setTimeout(() => { window.close(); }, 2000);
      }
    } catch (e) {}
  </script>
</body>
</html>
