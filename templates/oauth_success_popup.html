<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Otentikasi Berhasil · PhisGuard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #08130e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #0c1c15;
      border: 1px solid #1e3a31;
      padding: 32px 28px;
      border-radius: 14px;
      max-width: 380px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .dot {
      width: 44px;
      height: 44px;
      background: #10b981;
      color: #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 22px;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot">✓</div>
    <h3 style="margin:0 0 8px 0; color:#6ee7b7; font-size:16px;">Berhasil Terhubung!</h3>
    <p style="font-size:13px; color:#cbd5e1; margin:0 0 16px 0; line-height:1.5;">
      Akun Google <b>{{ user_email }}</b> berhasil dihubungkan ke PhisGuard.
    </p>
    <small style="color:#64748b; font-size:11px;">Jendela ini akan menutup otomatis dalam sekejap...</small>
  </div>
  <script>
    function notifySuccess() {
      // 1. Kirim via postMessage ke window.opener (jika ada)
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({ type: "GMAIL_AUTH_SUCCESS", email: "{{ user_email }}" }, "*");
        }
      } catch (e) {}

      // 2. Kirim via BroadcastChannel (bebas hambatan cross-origin/COOP)
      try {
        if ("BroadcastChannel" in window) {
          const channel = new BroadcastChannel("phisguard_auth");
          channel.postMessage({ type: "GMAIL_AUTH_SUCCESS", email: "{{ user_email }}" });
        }
      } catch (e) {}

      // 3. Simpan sinyal di localStorage untuk ditangkap storage event listener
      try {
        localStorage.setItem("phisguard_gmail_connected", Date.now().toString());
      } catch (e) {}

      // 4. Tutup popup setelah 600ms, atau fallback redirect ke halaman scan
      setTimeout(() => {
        const targetUrl = window.location.origin + "/scan?tab=email&gmail=connected";
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.location.href = targetUrl;
            window.close();
            return;
          }
        } catch (e) {}

        try {
          window.close();
        } catch (e) {}

        // Jika window.close() dicegah browser (misal di smartphone / mobile):
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 300);
      }, 600);
    }

    notifySuccess();
  </script>
</body>
</html>
